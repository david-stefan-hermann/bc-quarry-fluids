plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.0-alpha.7'
    id 'me.modmuss50.mod-publish-plugin' version '1.0.0'
}

version = project.mod_version
group = project.maven_group

repositories {
    // BuildCraft Refabricated is not on a maven; it is compiled against from libs/ (see gradle.properties).
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // 26.x mods use Mojang names directly, so a plain file dependency is enough to compile.
    compileOnly files(project.buildcraft_jar)
    // Put BuildCraft on the dev runtime classpath so runServer/runClient load it (not bundled into our jar).
    localRuntime files(project.buildcraft_jar)
    // Optional extra mods for dev testing (Refined Storage for the upgrade items); ignored when absent.
    fileTree(dir: 'libs', include: ['refinedstorage-*.jar', 'cloth-config-*.jar']).each { f ->
        localRuntime files(f)
    }
}

// `./gradlew runClient -PdevScreenshot` joins the dev server on localhost:25598, opens the quarry menu at
// 0,-60,0, saves screenshots/bcqf-quarry.png and quits (see BcQuarryFluids.SCREENSHOT_PROPERTY).
if (project.hasProperty('devScreenshot')) {
    loom {
        runs {
            client {
                vmArg "-Dbcqf.screenshot=0,-60,0"
                programArgs "--quickPlayMultiplayer", "localhost:25598", "--width", "1280", "--height", "720"
            }
            server {
                vmArg "-Dbcqf.screenshot=0,-60,0"
            }
        }
    }
}

// `./gradlew runServer -PdevDebug` logs the add-on's blocker / pump decisions.
if (project.hasProperty('devDebug')) {
    loom {
        runs {
            server {
                vmArg "-Dbcqf.debug=true"
            }
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

base {
    archivesName = project.archives_base_name
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// `./gradlew publishMods` uploads build/libs/<jar> to CurseForge and Modrinth. Tokens and project ids live in
// ~/.gradle/gradle.properties (bcqf.curseforge.token / bcqf.curseforge.projectId / bcqf.modrinth.token /
// bcqf.modrinth.projectId), never in the repository. The changelog is the top section of CHANGELOG.md.
publishMods {
    file = tasks.named('jar').flatMap { it.archiveFile }
    changelog = provider { topChangelogSection() }
    type = STABLE
    displayName = "BuildCraft Quarry Extras ${project.version}"
    version = project.version.toString()
    modLoaders.add("fabric")

    curseforge {
        accessToken = providers.gradleProperty("bcqf.curseforge.token")
        projectId = providers.gradleProperty("bcqf.curseforge.projectId")
        minecraftVersions.add(project.minecraft_version)
        javaVersions.add(JavaVersion.VERSION_25)
        clientRequired = true
        serverRequired = true
        requires("buildcraftrefabricated", "fabric-api")
        optional("refined-storage")
    }
    modrinth {
        accessToken = providers.gradleProperty("bcqf.modrinth.token")
        projectId = providers.gradleProperty("bcqf.modrinth.projectId")
        minecraftVersions.add(project.minecraft_version)
        requires("buildcraftrefabricated", "fabric-api")
        optional("refined-storage")
    }
}

/** First "## " section of CHANGELOG.md, without its heading. */
String topChangelogSection() {
    def lines = file("CHANGELOG.md").readLines()
    def out = []
    boolean inSection = false
    for (line in lines) {
        if (line.startsWith("## ")) {
            if (inSection) break
            inSection = true
            continue
        }
        if (inSection) out << line
    }
    return out.join("\n").trim()
}
